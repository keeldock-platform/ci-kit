        required: false
      SOURCE_READ_31:
        required: false
      SOURCE_READ_32:
        required: false
permissions: {}
cache-mode: none
jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.guard.outputs.environment }}
      env-linux-debian: ${{ steps.guard.outputs.env-linux-debian }}
      env-linux-arch: ${{ steps.guard.outputs.env-linux-arch }}
      env-macos-arm64: ${{ steps.guard.outputs.env-macos-arm64 }}
      env-macos-x64: ${{ steps.guard.outputs.env-macos-x64 }}
      env-windows-x64: ${{ steps.guard.outputs.env-windows-x64 }}
      env-windows-arm64: ${{ steps.guard.outputs.env-windows-arm64 }}
      env-web-linux: ${{ steps.guard.outputs.env-web-linux }}
      env-server-linux-x64: ${{ steps.guard.outputs.env-server-linux-x64 }}
      env-server-linux-arm64: ${{ steps.guard.outputs.env-server-linux-arm64 }}

    env:
      CI_REQUEST: ${{ toJSON(inputs) }}
      CI_ADMISSION_POLICY: ${{ vars.CI_ADMISSION_POLICY }}
      CI_KIT_SHA: ${{ inputs.kit_sha }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_WORKFLOW_REF: ${{ github.workflow_ref }}
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REPOSITORY_ID: ${{ github.repository_id }}
      CI_REF: ${{ github.ref }}
      CI_REF_TYPE: ${{ github.ref_type }}
      CI_ACTOR: ${{ github.actor }}
      CI_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      CI_FORK: ${{ github.event.repository.fork }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_ATTEMPT: ${{ github.run_attempt }}
      CI_KIT_OPERATION: preflight
    steps:
      - name: Kit
        uses: $/.github/actions/kit-bootstrap
        with:
          kit-sha: ${{ inputs.kit_sha }}
      - name: Guard
        id: guard
        shell: bash
        run: '"$RUNNER_TEMP/ci-kit"'
  plan:
    name: plan
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.preflight.outputs.environment }}
    outputs:
      linux-debian: ${{ steps.plan.outputs.linux-debian }}
      linux-arch: ${{ steps.plan.outputs.linux-arch }}
      macos-arm64: ${{ steps.plan.outputs.macos-arm64 }}
      macos-x64: ${{ steps.plan.outputs.macos-x64 }}
      windows-x64: ${{ steps.plan.outputs.windows-x64 }}
      windows-arm64: ${{ steps.plan.outputs.windows-arm64 }}
      ios-simulator: ${{ steps.plan.outputs.ios-simulator }}
      android-emulator: ${{ steps.plan.outputs.android-emulator }}
      web-linux: ${{ steps.plan.outputs.web-linux }}
      server-linux-x64: ${{ steps.plan.outputs.server-linux-x64 }}
      server-linux-arm64: ${{ steps.plan.outputs.server-linux-arm64 }}
