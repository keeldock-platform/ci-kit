name: Validate
on:
  workflow_call:
    inputs:
      concern:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      mode:
        required: true
        type: string
      purpose:
        required: true
        type: string
      platforms:
        required: true
        type: string
      selector:
        required: true
        type: string
      request_id:
        required: true
        type: string
      kit_api:
        required: true
        type: string
      request_digest:
        required: true
        type: string
      kit_sha:
        type: string
