name: Synthetic matrix
on:
  workflow_call:
    inputs:
      request:
        type: string
        required: true
      kit_sha:
        type: string
        required: true
      experiment_policy:
        type: string
        required: true
    secrets:
      CI_SYNTHETIC_SOURCE_MAP:
        required: true
      SYNTHETIC_SOURCE_TOKEN:
        required: true
permissions: {}
cache-mode: none
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI_REQUEST: ${{ inputs.request }}
      CI_EXPERIMENT_POLICY: ${{ inputs.experiment_policy }}
    steps:
      - name: Kit
        uses: $/.github/actions/kit-bootstrap
        with:
          kit-sha: ${{ inputs.kit_sha }}
          route: experiment
      - name: Compile and boundary checks
        shell: bash
        run: |
          cd public-control
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          echo 'STAGE bootstrap PASS'
          echo 'Synthetic source-free bootstrap PASS' >> "$GITHUB_STEP_SUMMARY"
  pack:
    needs: bootstrap
    name: pack-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-arm64
            runner: windows-11-arm
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    environment: ci-experiment
    permissions:
      contents: read
    env:
      CI_ROUTE: experiment
      CI_REQUEST: ${{ inputs.request }}
      CI_EXPERIMENT_POLICY: ${{ inputs.experiment_policy }}
      CI_KIT_SHA: ${{ inputs.kit_sha }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_WORKFLOW_REF: ${{ github.workflow_ref }}
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REPOSITORY_ID: ${{ github.repository_id }}
      CI_REF: ${{ github.ref }}
      CI_REF_TYPE: ${{ github.ref_type }}
      CI_ACTOR: ${{ github.actor }}
      CI_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      CI_FORK: ${{ github.event.repository.fork }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_ATTEMPT: ${{ github.run_attempt }}
      CI_KIT_OPERATION: pack
      CI_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Runner
        shell: bash
        run: echo 'STAGE runner PASS'
      - name: Kit
        uses: $/.github/actions/kit-bootstrap
        with:
          kit-sha: ${{ inputs.kit_sha }}
          route: experiment
      - name: Source-free simulator service preparation
        if: matrix.platform == 'ios-simulator'
        shell: bash
        run: node public-control/fixtures/synthetic/ios-prepare.mjs
      - name: Source-free hosted inventory
        shell: bash
        run: node public-control/fixtures/synthetic/probe.mjs
      - name: Windows public tool staging
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: ./public-control/fixtures/synthetic/windows-tools.ps1
      - name: Windows native MSVC binding
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: ./public-control/fixtures/synthetic/windows-msvc.ps1
      - name: Windows public Rust preparation
        if: startsWith(matrix.platform, 'windows-')
        shell: bash
        run: node public-control/fixtures/synthetic/windows-rust.mjs
      - name: Public browser reproduction
        if: matrix.platform == 'web-linux'
        shell: bash
        run: bash public-control/fixtures/synthetic/web-public.sh
      - name: Source-free boundary regressions
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            PATH="$(cygpath -u "$CI_MSVC_BIN"):$PATH"
            export PATH
            hash -r
          fi
          cd public-control
          node --test fixtures/synthetic/rust/cargo-check.test.mjs
          if [[ "$RUNNER_OS" == Windows ]]; then
            CI_PUBLIC_WINDOWS_RUST_SMOKE=1 go test -count=1 -v -mod=readonly ./internal/process -run 'TestHostedWindowsRustSmoke|TestWindowsLinkerRejectsGitCoreutils'
          fi
          go test -count=1 -v -mod=readonly ./internal/collector
          CI_REGISTERED_SIGNATURE_SMOKE=1 go test -count=1 -v -mod=readonly ./internal/github -run '^TestHostedRegisteredSignature$'
          go test -mod=readonly -v ./internal/github -run '^TestHostedSignatureAssessment$' > "$RUNNER_TEMP/signature-assessment.log" 2>&1
          grep 'PUBLIC_SIGNATURE_DIAGNOSTIC {' "$RUNNER_TEMP/signature-assessment.log" || true
          if go test -mod=readonly ./cmd/ci-kit -run 'TestSharedSyntheticEnvironmentStaysExperimentOnly|TestExperimentRouteIsSeparateAndSyntheticOnly' > "$RUNNER_TEMP/boundary-test.log" 2>&1; then
            if go test -mod=readonly ./internal/github -run '^TestSignatureToolsIgnoreAmbientPathOrder$' > "$RUNNER_TEMP/signature-tool-test.log" 2>&1; then
              echo 'STAGE signature-tools PASS'
              if go test -mod=readonly ./internal/github -run '^TestPublishedKitIncludesCurrentRevocationAuthority$' > "$RUNNER_TEMP/signature-ledger-test.log" 2>&1; then
                echo 'STAGE signature-ledger PASS'
              else
                echo 'STAGE signature-ledger FAIL'
                exit 3
              fi
            else
              echo 'STAGE signature-tools FAIL'
              exit 3
            fi
            echo 'STAGE boundary PASS'
          else
            echo 'STAGE boundary FAIL'
            exit 1
          fi
      - name: Android public tool
        if: matrix.platform == 'android-emulator'
        uses: $/.github/actions/android-checkout
      - name: Source-free Android preparation
        if: matrix.platform == 'android-emulator'
        shell: bash
        run: |
          node public-control/fixtures/synthetic/android-bundle.cjs
          # https://github.com/ReactiveCircus/android-emulator-runner/blob/a421e43855164a8197daf9d8d40fe71c6996bb0d/README.md
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          node public-control/fixtures/synthetic/android-support.cjs
          node public-control/fixtures/synthetic/android-public.cjs
      - name: Synthetic secrets ready
        shell: bash
        env:
          SOURCE_MAP: ${{ secrets.CI_SYNTHETIC_SOURCE_MAP }}
          SOURCE_READ_01: ${{ secrets.SYNTHETIC_SOURCE_TOKEN }}
        run: |
          set -eu
          test -n "$SOURCE_MAP" && test -n "$SOURCE_READ_01" || { echo 'STAGE secrets FAIL'; exit 3; }
          echo 'STAGE secrets PASS'
      - name: Execute
        id: execute
        shell: bash
        env:
          SOURCE_MAP: ${{ secrets.CI_SYNTHETIC_SOURCE_MAP }}
          SOURCE_READ_01: ${{ secrets.SYNTHETIC_SOURCE_TOKEN }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            PATH="$(cygpath -u "$CI_MSVC_BIN"):$PATH"
            export PATH
            hash -r
          fi
          set +e
          "$RUNNER_TEMP/ci-kit"
          code=$?
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Encrypted failure diagnostics
        if: ${{ failure() && steps.execute.outputs.diagnostics == 'ready' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-diagnostics/failure-${{ matrix.platform }}-${{ github.run_attempt }}.age
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Owned public Windows tool cleanup
        if: always() && startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          if ($env:CI_OWNED_WINDOWS_TOOL) {
            Remove-Item -LiteralPath $env:CI_OWNED_WINDOWS_TOOL -Recurse -Force
            Remove-Item -LiteralPath (Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'KeelDock') -Recurse -Force
          }
