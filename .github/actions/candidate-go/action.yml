name: Select native Go
description: Immutable public tool dependency
inputs:
  architecture:
    description: Public candidate input
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: '1.27.4'
        architecture: ${{ inputs.architecture }}
        check-latest: false
        cache: false
