name: Select analysis runtime
description: Immutable public tool dependency
inputs:
  architecture:
    description: Public candidate input
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '26.8.1'
        architecture: ${{ inputs.architecture }}
        check-latest: false
        package-manager-cache: false
