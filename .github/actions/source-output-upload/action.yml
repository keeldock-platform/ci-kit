name: Upload explicit encrypted lock SOURCE output
description: Fixed allowlisted source-return ciphertext, not failure diagnostics
runs:
  using: composite
  steps:
    - name: Upload sealed lock source ciphertext
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: source-locks-linux-debian-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-source-output/${{ github.run_attempt }}/locks-linux-debian-${{ github.run_attempt }}.age
        retention-days: 1
        if-no-files-found: error
        include-hidden-files: false
        overwrite: false
        compression-level: 0
