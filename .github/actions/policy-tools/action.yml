name: Policy tools
description: Fetch checksummed source-free maintenance tools into the job temp directory
runs:
  using: composite
  steps:
    - name: Tools
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/policy-tools"
        cd "$RUNNER_TEMP/policy-tools"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 120 -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --status
        tar -xzf actionlint.tar.gz actionlint
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 120 -o zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
        echo 'bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  zizmor.tar.gz' | sha256sum --check --status
        tar -xzf zizmor.tar.gz zizmor
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 120 -o gh-actions-lock https://github.com/github/gh-actions-lock/releases/download/v0.5.1/linux-amd64
        echo '94009f287cfcc046ff371824824c203a8a44c981ca2dac344052744897c29c3a  gh-actions-lock' | sha256sum --check --status
        chmod 700 actionlint zizmor gh-actions-lock
